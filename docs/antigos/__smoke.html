<!doctype html><html><head><meta charset="utf-8"><style>
        /* ============================================
           ESTILOS GLOBAIS
           ============================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            color: #e0e0e0; 
            min-height: 100vh; 
            padding: 20px; 
            background: #000;
            overflow-x: hidden; 
            position: relative; 
        }
        
        .galaxy-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
            background: 
                radial-gradient(ellipse at 20% 30%, rgba(120, 50, 180, 0.5) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(50, 100, 200, 0.5) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(200, 50, 100, 0.4) 0%, transparent 60%),
                linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 25%, #0a1a3e 50%, #1a0a2e 75%, #0a0a1a 100%);
        }
        
        .stars-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle var(--duration) infinite; animation-delay: var(--delay); }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 1; transform: scale(1.3); } }
        
        .container { max-width: 1400px; margin: 0 auto; position: relative; z-index: 2; }
        h1 { text-align: center; color: #fff; margin-bottom: 10px; font-size: 2.2em; }
        
        .lang-selector { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .lang-btn { padding: 8px 16px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); color: #fff; border-radius: 20px; cursor: pointer; }
        .lang-btn.active { background: rgba(255,255,255,0.4); border-color: #fff; font-weight: bold; }
        
        .login-screen { display: flex; justify-content: center; align-items: center; min-height: 80vh; }
        .login-box { background: rgba(255,255,255,0.08); padding: 40px; border-radius: 20px; border: 2px solid rgba(255,255,255,0.2); text-align: center; max-width: 450px; width: 100%; }
        .login-box h2 { color: #fff; margin-bottom: 10px; font-size: 1.8em; }
        .login-box input { width: 100%; padding: 15px; margin-bottom: 15px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); border-radius: 10px; color: #fff; }
        .btn-login, .btn-register { width: 100%; padding: 15px; background: linear-gradient(135deg, #00d4ff, #0099cc); color: #fff; border: none; border-radius: 10px; font-size: 1.1em; cursor: pointer; margin-bottom: 10px; font-weight: bold; }
        .btn-secondary { background: linear-gradient(135deg, #6c757d, #495057); }

        /* MERCADO */
        .market-toolbar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:20px; padding:15px; background:rgba(0,212,255,0.06); border:1px solid rgba(0,212,255,0.18); border-radius:12px; }
        .market-toolbar input, .market-toolbar select { width:auto; min-width:180px; margin:0; }
        .market-balance { margin-left:auto; padding:10px 15px; border-radius:10px; background:rgba(40,167,69,0.15); border:1px solid rgba(40,167,69,0.35); font-weight:bold; }
        .market-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }
        .market-card { display:grid; grid-template-columns:96px 1fr; gap:14px; padding:15px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12); border-radius:12px; }
        .market-card:hover { border-color:rgba(0,212,255,0.5); background:rgba(0,212,255,0.06); }
        .market-card img { width:96px; height:96px; object-fit:contain; background:rgba(0,0,0,0.25); border-radius:10px; }
        .market-card-placeholder { width:96px; height:96px; display:flex; align-items:center; justify-content:center; font-size:2.7em; background:rgba(0,0,0,0.25); border-radius:10px; }
        .market-card h4 { margin:0 0 6px; color:#fff; }
        .market-meta { color:#aaa; font-size:.9em; line-height:1.5; }
        .market-desc { color:#ccc; margin:8px 0; font-size:.92em; }
        .market-buy { margin-top:10px; padding:9px 14px; border:0; border-radius:8px; background:#28a745; color:white; font-weight:bold; cursor:pointer; }
        .market-buy:hover { filter:brightness(1.08); }

        .hidden { display: none !important; }
        
        .user-header { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.08); padding: 15px 25px; border-radius: 10px; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; }
        .user-info { color: #fff; font-size: 1.1em; }
        .btn-logout { background: #dc3545; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
        
        .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        .tab-btn { padding: 12px 20px; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.2); color: #fff; border-radius: 10px; cursor: pointer; font-size: 1em; }
        .tab-btn.active { background: rgba(255,255,255,0.25); border-color: #00d4ff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .char-manager { background: rgba(255,255,255,0.06); border-radius: 15px; padding: 20px; margin-bottom: 30px; border: 2px solid rgba(255,255,255,0.1); }
        .char-manager h3 { color: #fff; margin-bottom: 15px; }
        .char-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .char-item { background: rgba(255,255,255,0.08); border-radius: 10px; padding: 15px; text-align: center; border: 2px solid rgba(255,255,255,0.1); cursor: pointer; }
        .char-item:hover { transform: translateY(-3px); border-color: #00d4ff; }
        .char-item.active { border-color: #28a745; box-shadow: 0 0 15px rgba(40,167,69,0.5); }
        .char-item-avatar { width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, #00d4ff, #0099cc); margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 2em; overflow: hidden; }
        .char-item-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .char-item-name { color: #fff; font-weight: bold; margin-bottom: 5px; }
        .char-item-actions { display: flex; gap: 5px; margin-top: 10px; justify-content: center; }
        .btn-small { padding: 5px 10px; border: none; border-radius: 5px; cursor: pointer; font-size: 0.85em; }

        /* v46.35.0 — padronização visual do painel Mapa da Mesa */
        #laboratorio-combate #labMasterGameControls > button,
        #laboratorio-combate #labMasterMapLoader > button,
        #laboratorio-combate #labMapCreationControls > button {
            min-height: 40px; height: 40px; padding: 0 14px; border-radius: 8px;
            display: inline-flex; align-items: center; justify-content: center; line-height: 1.1;
        }
        #laboratorio-combate #labMasterGameControls > label,
        #laboratorio-combate #labMasterMapLoader > label,
        #laboratorio-combate #labMapCreationControls > label,
        #laboratorio-combate #labEditMapToggleWrap {
            min-height: 40px; box-sizing: border-box;
        }
        #laboratorio-combate #labMasterGameControls select,
        #laboratorio-combate #labMasterMapLoader select,
        #laboratorio-combate #labMapCreationControls select,
        #laboratorio-combate #labZoom {
            height: 40px; min-height: 40px; box-sizing: border-box; border-radius: 8px;
        }
        #laboratorio-combate #labMapCreationControls input[type="text"],
        #laboratorio-combate #labMapCreationControls input[type="number"] {
            height: 40px; min-height: 40px; box-sizing: border-box;
        }
        #laboratorio-combate #labMapCreationControls input[type="color"] {
            width: 40px !important; height: 40px !important; min-height: 40px; box-sizing: border-box;
        }
        .btn-select { background: #28a745; color: #fff; }
        .btn-delete { background: #dc3545; color: #fff; }
        .btn-new { width: 100%; padding: 15px; background: linear-gradient(135deg, #00d4ff, #0099cc); color: #fff; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
        
        .character-card { background: rgba(255,255,255,0.06); border-radius: 20px; padding: 30px; margin-bottom: 30px; border: 2px solid rgba(255,255,255,0.1); }
        .character-header { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; }
        .avatar { width: 100px; height: 100px; border-radius: 50%; border: 3px solid #00d4ff; background: linear-gradient(135deg, #00d4ff, #0099cc); display: flex; align-items: center; justify-content: center; font-size: 3em; box-shadow: 0 0 20px rgba(0,212,255,0.5); overflow: hidden; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .char-info h2 { color: #fff; font-size: 2em; margin-bottom: 5px; }
        .char-info p { color: #aaa; font-size: 1em; }
        
        .attributes-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .attr-card { background: rgba(255,255,255,0.08); border-radius: 15px; padding: 20px; text-align: center; border: 2px solid rgba(255,255,255,0.1); }
        .attr-label { color: #aaa; font-size: 0.9em; margin-bottom: 10px; font-weight: bold; }
        .attr-value { color: #00d4ff; font-size: 2.5em; font-weight: bold; }
        .attr-bonus input { width: 60px; text-align: center; background: rgba(0,212,255,0.2); border: 1px solid #00d4ff; border-radius: 5px; color: #fff; font-size: 1em; margin-top: 5px; }
        
        .derived-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; background: rgba(255,255,255,0.05); padding: 20px; border-radius: 15px; text-align: center; }
        .stat-box { background: rgba(0,212,255,0.1); padding: 15px; border-radius: 10px; border: 1px solid rgba(0,212,255,0.3); }
        .stat-label { color: #aaa; font-size: 0.9em; margin-bottom: 5px; }
        .stat-value { color: #00d4ff; font-size: 1.8em; font-weight: bold; }
        .stat-value input { width: 80%; text-align: center; background: rgba(0,212,255,0.2); border: 1px solid #00d4ff; border-radius: 5px; color: #00d4ff; font-size: 1.2em; font-weight: bold; }
        
        .form-section { background: rgba(255,255,255,0.06); border-radius: 15px; padding: 25px; margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.1); }
        .form-section h3 { color: #fff; margin-bottom: 20px; font-size: 1.5em; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #fff; font-weight: 600; }
        input[type="text"], input[type="number"], input[type="url"], input[type="file"], select, textarea { width: 100%; padding: 12px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.2); border-radius: 8px; color: #fff; font-size: 1em; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #00d4ff; }
        select option { background: #1a1a2e; color: #fff; }
        
        .btn-save { width: 100%; padding: 15px; background: linear-gradient(135deg, #28a745, #218838); color: #fff; border: none; border-radius: 10px; font-size: 1.1em; cursor: pointer; font-weight: bold; }
        .btn-import { background: linear-gradient(135deg, #9b59b6, #8e44ad); color: #fff; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; margin-right: 10px; }
        .btn-template { background: rgba(255,255,255,0.2); color: #fff; border: 2px solid rgba(255,255,255,0.3); padding: 12px 20px; border-radius: 8px; cursor: pointer; }
        
        .total-points { text-align: center; padding: 20px; background: rgba(0,212,255,0.1); border-radius: 10px; margin-bottom: 20px; }
        .total-points .value { color: #00d4ff; font-size: 2.5em; font-weight: bold; }
        .total-points .value.exceeded { color: #ff6b6b; }
        .total-points .limit { color: #aaa; font-size: 0.9em; }
        
        .char-tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; border-bottom: 2px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        .char-tab-btn { padding: 10px 18px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); color: #aaa; border-radius: 8px; cursor: pointer; }
        .char-tab-btn.active { background: rgba(0,212,255,0.2); border-color: #00d4ff; color: #fff; }
        .char-tab-content { display: none; }
        .char-tab-content.active { display: block; }
        
        /* INVENTÁRIO */
        .inventory-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-top: 20px; }
        .inventory-compartment { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 20px; border: 2px solid rgba(255,255,255,0.1); }
        .inventory-compartment h4 { color: #00d4ff; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
        .inventory-compartment .capacity { color: #aaa; font-size: 0.85em; margin-bottom: 15px; }
        .inventory-slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; }
        .inventory-slot { aspect-ratio: 1; background: rgba(0,0,0,0.3); border: 2px dashed rgba(255,255,255,0.2); border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 2em; transition: all 0.2s; position: relative; }
        .inventory-slot:hover { border-color: #00d4ff; background: rgba(0,212,255,0.1); }
        .inventory-slot.filled { border-style: solid; border-color: #28a745; background: rgba(40,167,69,0.1); }
        .inventory-slot.drag-over { border-color: #ffd700; background: rgba(255,215,0,0.2); }
        .inventory-slot img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }
        .inventory-slot.full-width { grid-column: span 2; aspect-ratio: 3/1; }
        .inventory-slot[draggable="true"] { cursor: grab; }
        .inventory-slot[draggable="true"]:active { cursor: grabbing; }
        .inventory-slot.drag-source { opacity: 0.5; }
        .inventory-help { color:#aaa; font-size:0.9em; margin:0 0 15px; }
        .db-table-wrap { width:100%; overflow-x:auto; border:1px solid rgba(255,255,255,0.12); border-radius:10px; }
        .db-table { width:100%; min-width:1250px; border-collapse:collapse; background:rgba(0,0,0,0.12); }
        .db-table th, .db-table td { padding:10px 12px; border-bottom:1px solid rgba(255,255,255,0.10); vertical-align:middle; text-align:left; }
        .db-table th { color:#00d4ff; background:rgba(0,212,255,0.10); position:sticky; top:0; z-index:1; }
        .db-table td { color:#ddd; }
        .db-table .name-pt { color:#fff; font-weight:bold; }
        .db-table .actions { white-space:nowrap; }
        .db-item-thumb { width:76px; height:76px; border-radius:10px; object-fit:cover; display:block; border:1px solid rgba(0,212,255,0.35); background:rgba(0,0,0,0.25); }
        .db-item-thumb.placeholder { display:flex; align-items:center; justify-content:center; font-size:2em; color:#777; }
        .db-item-main-row td { border-bottom:none; padding-bottom:5px; }
        .db-item-meta-row td { padding-top:5px; color:#bdbdbd; background:rgba(255,255,255,0.018); }
        .db-item-description { min-width:320px; max-width:520px; white-space:normal; line-height:1.4; }
        .db-name-table { width:100%; min-width:1050px; border-collapse:collapse; background:rgba(0,0,0,0.12); }
        .db-name-table th, .db-name-table td { padding:10px 12px; border-bottom:1px solid rgba(255,255,255,0.10); vertical-align:top; text-align:left; }
        .db-name-table th { color:#00d4ff; background:rgba(0,212,255,0.10); }
        .db-name-table td:first-child { color:#fff; font-weight:bold; }
        .db-name-table .actions { white-space:nowrap; }
        
        .item-tooltip { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.95); border: 2px solid #00d4ff; border-radius: 8px; padding: 10px; min-width: 200px; max-width: 300px; z-index: 100; display: none; font-size: 0.9em; pointer-events: none; }
        .inventory-slot:hover .item-tooltip { display: block; }
        .item-tooltip h5 { color: #00d4ff; margin-bottom: 5px; }
        .item-tooltip p { color: #aaa; font-size: 0.85em; margin: 3px 0; }
        
        /* MODAL */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; display: none; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: #1a1a2e; padding: 30px; border-radius: 15px; border: 2px solid #00d4ff; max-width: 600px; width: 90%; max-height: 90vh; overflow-y: auto; }
        .modal-content h3 { color: #00d4ff; margin-bottom: 20px; }
        .modal-buttons { display: flex; gap: 10px; margin-top: 20px; }
        .btn-confirm { background: #28a745; color: #fff; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; }
        .btn-cancel { background: #dc3545; color: #fff; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; }
        
        /* COMBATE */
        .combat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .combat-section { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 20px; border: 2px solid rgba(255,255,255,0.1); }
        .combat-section h4 { color: #00d4ff; margin-bottom: 15px; font-size: 1.2em; }
        .combat-title-row { display:grid; grid-template-columns: 1fr 80px 80px; gap:10px; align-items:end; margin-bottom:15px; min-height:29px; }
        .combat-title-row h4 { margin:0; }
        .combat-title-col { color:#00d4ff; font-weight:bold; text-align:center; font-size:.92em; line-height:1.15; }
        .inventory-title-row { display:flex; justify-content:space-between; align-items:center; gap:20px; flex-wrap:wrap; margin-bottom:8px; }
        .inventory-title-row h3 { margin:0; }
        .inventory-resources-box { display:flex; align-items:center; gap:10px; margin-left:auto; padding:8px 12px; border:1px solid rgba(0,212,255,.35); background:rgba(0,212,255,.08); border-radius:10px; }
        .inventory-resources-box label { color:#00d4ff; font-weight:bold; white-space:nowrap; }
        .inventory-resources-box input { width:150px; padding:8px 10px; text-align:right; font-weight:bold; }
        .hit-location { display: grid; grid-template-columns: 1fr 80px 80px; gap: 10px; align-items: center; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 6px; margin-bottom: 8px; }
        .hit-location-name { color: #fff; font-weight: bold; }
        .hit-location input { width: 100%; padding: 5px; text-align: center; background: rgba(0,212,255,0.2); border: 1px solid #00d4ff; border-radius: 5px; color: #fff; }
        .hit-location input[readonly] { background: rgba(255,255,255,0.1); color: #aaa; border-color: rgba(255,255,255,0.3); }
        .hit-location input.damage { background: rgba(231,76,60,0.2); border-color: #e74c3c; }
        .hit-location input.damage:focus { outline: none; background: rgba(231,76,60,0.3); }
        
        /* ROLAGEM */
        .dice-roller { background: rgba(255,255,255,0.05); border-radius: 15px; padding: 25px; text-align: center; }
        .dice-display { font-size: 5em; margin: 20px 0; color: #00d4ff; }
        .dice-buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
        .dice-btn { padding: 15px 25px; background: linear-gradient(135deg, #9b59b6, #8e44ad); color: #fff; border: none; border-radius: 10px; cursor: pointer; font-size: 1.1em; font-weight: bold; }
        .roll-result { margin-top: 20px; padding: 20px; background: rgba(0,212,255,0.1); border-radius: 10px; border: 2px solid rgba(0,212,255,0.3); }
        .skill-test-section, .attack-section { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .skill-test-section h4, .attack-section h4 { color: #00d4ff; margin-bottom: 15px; }
        
        /* BANCO DE DADOS */
        .db-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; background: rgba(255,255,255,0.05); border-radius: 8px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.1); transition: all 0.2s; }
        .db-item:hover { background: rgba(255,255,255,0.08); border-color: rgba(0,212,255,0.3); }
        .db-item-info { flex: 1; display: flex; align-items: center; gap: 15px; }
        .db-item-name { font-weight: bold; color: #fff; min-width: 180px; font-size: 1.05em; }
        .db-item-details { color: #aaa; font-size: 0.9em; flex: 1; }
        .db-item-actions { display: flex; gap: 5px; flex-shrink: 0; }
        .import-section { margin-bottom: 20px; padding: 15px; background: rgba(0,212,255,0.05); border-radius: 10px; border: 1px solid rgba(0,212,255,0.2); }
        
        /* TABELAS */
        .skills-table { width: 100%; border-collapse: collapse; margin-top: 15px; table-layout: fixed; }
        .skills-table th, .skills-table td { padding: 10px 12px; border: 1px solid rgba(255,255,255,0.1); text-align: left; vertical-align: middle; }
        .skills-table th { background: rgba(0,212,255,0.2); color: #fff; font-weight: bold; }
        .skills-table td { background: rgba(255,255,255,0.03); }
        .skills-table th:nth-child(1), .skills-table td:nth-child(1) { width: 35%; }
        .skills-table th:nth-child(2), .skills-table td:nth-child(2) { width: 20%; }
        .skills-table th:nth-child(3), .skills-table td:nth-child(3) { width: 10%; text-align: center; }
        .skills-table th:nth-child(4), .skills-table td:nth-child(4) { width: 15%; text-align: center; }

</style></head><body style="background:#191c32;color:white;font-family:Arial">
<select id="marketCategory" onchange="renderizarMercado()"></select><input id="marketSearch"><div id="marketGrid"></div><div id="marketNotice"></div><div id="marketBalance"></div><div id="support"></div>
<script>const itensDB=[{id:'agua',nome:'Água',categoria:'Alimentos e Bebidas',nivelAcesso:'Comum'},{id:'kit',nome:'Kit Médico',categoria:'Itens médicos',nivelAcesso:'Restrito'},{id:'antidoto',nome:'Antídoto',categoria:' Itens médicos ',nivelAcesso:'Comum'},{id:'militar',nome:'Item Militar',categoria:'Equipamentos',nivelAcesso:'Militar'},{id:'outro',nome:'Outros',categoria:'   ',nivelAcesso:'Livre'}],origensDB=[],carreirasDB=[];let char={nome:'Dra. Ilya',carreira:'medica',recursos:220};const obterPersonagemAtual_=()=>char,atualizarCompradorMercado_=()=>{},getNome=i=>i.nome,getDescricao=i=>i.descricao||'',categoriaNormalizada_=i=>i.categoria||'',escaparBanco_=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');function atualizarCategoriasMercado_() {
    const select = document.getElementById('marketCategory');
    if (!select) return;
    const atual = select.value;
    const categorias = [...new Set(itensDB.map(i => (String(i.categoria || '').trim() || 'Diversos')))].sort((a,b) => a.localeCompare(b));
    select.innerHTML = '<option value="" data-i18n="allCategories">Todas as categorias</option>' + categorias.map(c => `<option value="${escaparBanco_(c)}">${escaparBanco_(c)}</option>`).join('');
    if ([...select.options].some(o => o.value === atual)) select.value = atual;
}


function normalizarAcesso_(valor){
    return String(valor||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[_-]+/g,' ').trim();
}
function nivelAcessoNormalizado_(item){
    const raw=String(item?.nivelAcesso||'Livre').trim().toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    if(!raw || /livre|comum|sem restr/.test(raw))return 'Livre';
    if(/militar/.test(raw))return 'Militar';
    return 'Restrito';
}
function rankAcesso_(item){
    return ({Livre:0,Restrito:1,Militar:2})[nivelAcessoNormalizado_(item)]??0;
}
function textoPersonagemAcesso_(char){
    const origem=origensDB.find(o=>o.id===char?.origem);
    const carreira=carreirasDB.find(c=>c.id===char?.carreira);
    return `${char?.origem||''} ${origem?.id||''} ${origem?.nome||''} ${char?.carreira||''} ${carreira?.id||''} ${carreira?.nome||''} ${char?.conceito||''}`.toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function nivelMaxAcessoPersonagem_(char){
    const t=textoPersonagemAcesso_(char);
    const origemMilitar=String(char?.origem||'')==='militar';
    const origemArist=String(char?.origem||'')==='aristocratico';
    const carreiraMilitar=/\b(militar|soldad|polic|agente|agente secreto|agente de inteligencia|espia|espiao|spy|inteligencia|intelligence|marinha|exercito|forcas armadas)\b/.test(t);
    const carreiraRestrita=carreiraMilitar || /\b(pirata|bandido|crim|contraband|submundo|mercen|cacador de recompensas|cacador_recompensas|guarda-costas|guarda_costas|seguranca)\b/.test(t);
    if(origemMilitar||carreiraMilitar)return 'Militar';
    if(origemArist||carreiraRestrita)return 'Restrito';
    return 'Livre';
}
function acessoPermitidoItem_(char,item){
    const max=({Livre:0,Restrito:1,Militar:2})[nivelMaxAcessoPersonagem_(char)]??0;
    const rank=rankAcesso_(item);
    if(rank<=max)return true;
    // Autorizações profissionais são específicas: não transformam uma carreira em passe universal para itens Restritos.
    const pessoa=normalizarAcesso_(textoPersonagemAcesso_(char));
    const itemTxt=normalizarAcesso_(`${getNome(item)||''} ${item?.categoria||''} ${item?.tipo||''} ${item?.descricao||''} ${item?.acessoProfissional||item?.acessosProfissionais||''}`);
    const medico=/\b(medic|medico|medica|cirurg|paramedic|enferm)\b/.test(pessoa);
    if(medico&&/\b(medic|antidoto|nanogel|farmac|cirurg|kit medico|primeiros socorros)\b/.test(itemTxt)&&rank<=1)return true;
    const detetive=/\b(detetiv|investigador|investigacao)\b/.test(pessoa);
    if(detetive&&rank<=1){
        const armaCurta=/\b(pistola|revolver|blaster de palma|arma curta|laser leve|incapacit|stun|atordo)\b/.test(itemTxt);
        const policial=/\b(algema|scanner|investig|forense|comunicador|gravador)\b/.test(itemTxt);
        if(armaCurta||policial)return true;
    }
    return false;
}
function badgeAcesso_(item,permitido=true){
    const n=nivelAcessoNormalizado_(item);
    const cor=n==='Livre'?'#8ff0a8':n==='Restrito'?'#ffd166':'#ff8f8f';
    return `<span style="display:inline-block;padding:2px 7px;border-radius:999px;border:1px solid ${cor};color:${cor};font-size:.78em;">${n}${permitido?'':' · sem acesso'}</span>`;
}

window.renderizarMercado = () => {
    atualizarCompradorMercado_();
    const grid = document.getElementById('marketGrid');
    const notice = document.getElementById('marketNotice');
    const balance = document.getElementById('marketBalance');
    if (!grid || !notice || !balance) return;

    atualizarCategoriasMercado_();
    const char = obterPersonagemAtual_();
    balance.textContent = char ? Number(char.recursos || 0).toLocaleString('pt-BR') : '—';
    notice.textContent = char ? `${char.nome || 'Personagem'} • Recursos disponíveis: ${Number(char.recursos || 0).toLocaleString('pt-BR')}` : 'Selecione um personagem na aba Ficha antes de comprar.';

    const busca = String(document.getElementById('marketSearch')?.value || '').trim().toLowerCase();
    const categoria = String(document.getElementById('marketCategory')?.value || '').trim();
    const filtrados = itensDB.filter(item => {
        if(item?.disponivelCampanha===false) return false;
        const nomes = `${item.nome || ''} ${item.nome_en || ''} ${item.nome_zh || ''}`.toLowerCase();
        return (!busca || nomes.includes(busca)) && (!categoria || (String(item.categoria || '').trim() || 'Diversos') === categoria);
    }).sort((a,b) => rankAcesso_(a)-rankAcesso_(b) || getNome(a).localeCompare(getNome(b)));

    grid.innerHTML = filtrados.map(item => {
        const nome = escaparBanco_(getNome(item));
        const desc = escaparBanco_(getDescricao(item));
        const preco = Math.max(0, Number(item.preco || 0));
        const imagem = item.imagem ? `<img src="${escaparBanco_(item.imagem)}" alt="${nome}">` : '<div class="market-card-placeholder">📦</div>';
        const detalhes = [item.categoria || '', item.peso != null ? `${item.peso} kg` : '', item.pa != null ? `PA ${item.pa}` : '', item.pv != null ? `PV ${item.pv}` : '', item.dano ? `Dano ${item.dano}` : '', categoriaNormalizada_(item)==='armas' ? `Pen. ${Number(item.penetracao ?? obterPenetracaoArma_(item) ?? 0)}` : '', item.nivelAcesso ? `Acesso ${item.nivelAcesso}` : ''].filter(Boolean).join(' • ');
        const ehArma = categoriaNormalizada_(item) === 'armas';
        const permitido=char?acessoPermitidoItem_(char,item):false;
        const qualidade = ehArma ? `<label style="display:block;margin:8px 0 4px;color:#aaa;font-size:.88em;">Qualidade</label><select id="marketQuality_${escaparBanco_(item.id)}" onchange="atualizarPrecoQualidadeMercado_('${escaparBanco_(item.id)}')" style="width:100%;padding:7px;border-radius:7px;background:rgba(255,255,255,.10);color:white;border:1px solid rgba(255,255,255,.18);"><option value="Básica">Básica ×1</option><option value="Média">Média ×2</option><option value="Superior">Superior ×4</option></select>` : '';
        return `<div class="market-card">${imagem}<div><h4>${nome}</h4>${badgeAcesso_(item,char?permitido:true)}<div class="market-meta" style="margin-top:5px;">${escaparBanco_(detalhes)}</div>${desc ? `<div class="market-desc">${desc}</div>` : ''}${qualidade}<div style="margin-top:8px;"><strong id="marketPrice_${escaparBanco_(item.id)}">${preco.toLocaleString('pt-BR')}</strong></div><button class="market-buy" ${permitido?'':'disabled'} onclick="comprarItemMercado('${escaparBanco_(item.id)}')">${!char?'Selecione um personagem':permitido?'Comprar':'Sem acesso'}</button></div></div>`;
    }).join('') || '<p style="color:#aaa;">Nenhum item encontrado.</p>';
};

renderizarMercado();</script>
