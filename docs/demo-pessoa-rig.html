<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pessoa com esqueleto — antes e depois</title>
<style>
:root{color-scheme:dark}
body{margin:0;background:#0f1a2e;color:#e8eefb;font:14px system-ui,sans-serif;padding:16px}
h1{font-size:18px;margin:0 0 4px}h2{font-size:14px;margin:18px 0 6px;color:#ffd447}
p{margin:2px 0 10px;color:#9fb3cc;font-size:12px}
.fila{display:flex;gap:10px;flex-wrap:wrap}
.cel{background:#6f7d5c;border-radius:8px;position:relative;overflow:hidden}
.cel .rot{position:absolute;left:5px;top:3px;font-size:11px;color:#fff;text-shadow:0 1px 2px #000;z-index:5}
.a3dc{position:absolute;inset:0;isolation:isolate}.a3dc i{position:absolute;inset:0;background-repeat:no-repeat}.a3dc .som{mix-blend-mode:multiply}
.grupo{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:#9fb3cc}
</style></head><body>
<h1>Pessoa com esqueleto real (Blender) — antes e depois</h1>
<p>Esquerda de cada par: boneco de esferas (antes). Direita: esqueleto de 62 ossos com as animações reais do pacote (depois). Mesmas cores, mesmas camadas.</p>
<div id="app"></div>
<script type="module">
import {SPRITES_3D} from '../js/mesa-sprites-3d-dados.js';
import {lerVisual,corCamadasPessoa,camadaVisivel,ordemCamadas,CAMADAS_PESSOA} from '../js/mesa-arte3d.js';
const BASE='../arte/miniaturas3d/';
const VIS={p:'#d29a6a',r:'#2b2f36',q:'#3a3d44',d:'#b9bcc2',c:'#2a1418',e:'#b9bcc2',k:'#3b2a1e',h:'curto',capa:1,m:'ambos',a:'#b9bcc2',o:'normal',x:''};
const v=lerVisual('p=#d29a6a;r=#2b2f36;q=#3a3d44;d=#b9bcc2;c=#2a1418;e=#b9bcc2;k=#3b2a1e;h=curto;m=ambos;capa=1;x=M','demo');
const vAntigo=v;
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e;};
const celulas=[];
function monta(pai,sprite,visual,acao,vista,px,rot,antigo){
 const cam=SPRITES_3D[sprite].camadas;if(!cam)return;
 const cel=el('div','cel');cel.style.width=cel.style.height=px+'px';cel.append(el('span','rot',rot));
 const ordem=antigo?['capa','roupa','detalhe','pele','cabelo_curto']:ordemCamadas(vista);
 const cores=corCamadasPessoa(visual);if(antigo){cores.detalhe=visual.d;}
 for(const c of ordem){
  if(!cam[c])continue;
  if(!antigo&&!camadaVisivel(visual,c))continue;
  if(antigo&&c==='capa'&&!visual.capa)continue;
  const suf={cima:'lado',frente:'frente',costas:'costas',lado:'perfil'}[vista];
  const f=cam[c][acao+'_'+suf]||cam[c]['parado_'+suf];if(!f)continue;
  const g=el('div','a3dc'),url='url("'+BASE+f.arquivo+'")',tam=(f.quadros*100)+'% 100%';
  const a=el('i','cor'),b=el('i','som');
  a.style.cssText=`background-color:${cores[c]||'#2a2018'};-webkit-mask-image:${url};mask-image:${url};-webkit-mask-size:${tam};mask-size:${tam};-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat`;
  b.style.cssText=`background-image:${url};background-size:${tam}`;
  g.append(a,b);g.dataset.q=f.quadros;g.dataset.dur=f.dur||1;g.dataset.ciclo=/^(parado|andar|deitado|sentado)$/.test(acao)?'1':'';cel.append(g);
 }
 pai.append(cel);celulas.push(cel);return cel;
}
const app=document.getElementById('app');
function secao(titulo,nota,fn){app.append(el('h2','',titulo));if(nota)app.append(el('p','',nota));const f=el('div','fila');app.append(f);fn(f);}
const ACOES=[['parado','Parado'],['andar','Andando'],['atacar','Atacando'],['golpe','Levando golpe'],['morrer','Caindo']];
secao('No tamanho do mapa (≈ 45 px por metro, miniatura de 2,2 m)','É assim que o jogador vê no mapa.',f=>{
 for(const [a,t] of ACOES){const g=el('div','grupo');const par=el('div','fila');par.style.gap='4px';g.append(par,el('span','',t));f.append(g);
  monta(par,'cima_pessoa_v1',vAntigo,a,'cima',100,'antes',true);monta(par,'cima_pessoa',v,a,'cima',100,'depois',false);}
});
secao('Ampliado 3×','O mesmo, para ver os detalhes.',f=>{
 for(const [a,t] of ACOES.slice(1,3)){const g=el('div','grupo');const par=el('div','fila');par.style.gap='6px';g.append(par,el('span','',t));f.append(g);
  monta(par,'cima_pessoa_v1',vAntigo,a,'cima',300,'antes',true);monta(par,'cima_pessoa',v,a,'cima',300,'depois',false);}
});
secao('Editor de personagem: frente, lado, costas e de cima (com movimento)','De costas a capa e a mochila cobrem as costas; de frente ficam atrás do corpo.',f=>{
 for(const [vista,t] of [['frente','Frente'],['lado','Lado'],['costas','Costas'],['cima','De cima']]){const g=el('div','grupo');g.append(el('span','',t));f.append(g);
  monta(g,'cima_pessoa',v,'andar',vista,240,t,false);}
});
function tick(){const agora=Date.now();for(const cel of celulas)for(const g of cel.querySelectorAll('.a3dc')){const n=Number(g.dataset.q)||1;if(n<2)continue;const ciclo=(Number(g.dataset.dur)||1)*1000,i=g.dataset.ciclo?Math.floor((agora%ciclo)/ciclo*n)%n:Math.min(n-1,Math.floor((agora%(ciclo+900))/ciclo*n)),pos=(i/(n-1)*100)+'% 0';for(const k of g.querySelectorAll('i')){k.style.backgroundPosition=pos;k.style.webkitMaskPosition=k.style.maskPosition=pos;}}}
setInterval(tick,40);tick();window.__pronto=true;
</script></body></html>
