<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D100 · Mesa Estelar Experimental | Orla</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#101b28;color:#edf2ff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;height:100%;overflow:hidden}
body{display:flex;flex-direction:column;background:radial-gradient(circle at 15% 0,#3a285c 0,transparent 42%),linear-gradient(135deg,#101829,#0b2030)}
header{display:flex;align-items:center;gap:16px;justify-content:space-between;padding:8px 18px;background:#251f43;border-bottom:1px solid #655789;flex-wrap:wrap;z-index:20;min-height:58px}
.logo{font-size:16px;font-weight:750;letter-spacing:.02em;white-space:nowrap}
.logo small{font-size:10px;color:#bfb6e4;display:block;font-weight:400}
nav{display:flex;flex:1;justify-content:flex-end;gap:6px;flex-wrap:wrap}
nav button{border:1px solid #66588d;border-radius:8px;background:#34295d;color:#e0d7f4;cursor:pointer;padding:9px 12px;font:600 13px system-ui}
nav button[aria-selected=true]{background:#73528f;border-color:#cfaaed;color:#fff}
main{flex:1;min-height:0;position:relative}
.frame{width:100%;height:100%;border:0;display:none;background:#223b30}
.frame.active{display:block}
aside{display:none;position:absolute;inset:0;align-items:center;justify-content:center;pointer-events:none;color:#dae2ef}
.tip{font-size:11px;color:#b6c4db;white-space:nowrap}
@media(max-width:760px){header{padding:7px;gap:6px}.logo{font-size:13px}nav{justify-content:start;gap:3px}nav button{font-size:11px;padding:7px 8px}.tip{display:none}}
</style>
</head>
<body>
<header>
  <div class="logo">✦ D100 · Mesa Estelar <small>Experimental · Orla v0.58</small></div>
  <nav aria-label="Abas do Mesa Estelar Experimental">
    <button type="button" data-area="orla" aria-selected="true">🎮 Orla</button>
    <button type="button" data-area="escudo" aria-selected="false">🛡 Escudo do Mestre</button>
    <button type="button" data-area="mercado" aria-selected="false">🛒 Mercado</button>
    <button type="button" data-area="regras" aria-selected="false">📖 Regras</button>
    <button type="button" data-area="ficha" aria-selected="false">📋 Ficha</button>
  </nav>
  <span class="tip">Orla sem login · outros painéis exigem autenticação</span>
</header>
<main>
  <iframe class="frame active" id="orla-frame" src="./orla/index.html" title="Orla v0.58 jogo" allowfullscreen></iframe>
  <iframe class="frame" id="mesa-frame" title="Painéis do Mesa Estelar" allowfullscreen></iframe>
</main>
<script>
(function(){
 'use strict';
 const orla=document.getElementById('orla-frame'),mesa=document.getElementById('mesa-frame');
 let active='orla',lastArea='ficha';
 function show(area){
  active=area;
  const game=area==='orla';
  orla.classList.toggle('active',game);
  mesa.classList.toggle('active',!game);
  for(const b of document.querySelectorAll('nav button[data-area]'))b.setAttribute('aria-selected',String(b.dataset.area===area));
  if(!game){
   lastArea=area;
   if(!mesa.getAttribute('src'))mesa.src='./mesa.html?area='+encodeURIComponent(area);
   else try{mesa.contentWindow.postMessage({app:'orla-portal',area},location.origin)}catch(_){}
  }
  const hash=area==='orla'?'orla':area;
  history.replaceState(null,'','#'+hash);
 }
 document.querySelectorAll('nav button[data-area]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.area)));
 mesa.addEventListener('load',()=>{if(active!=='orla')try{mesa.contentWindow.postMessage({app:'orla-portal',area:active},location.origin)}catch(_){}});
 const requested=location.hash.replace('#','');
 if(['orla','escudo','mercado','regras','ficha'].includes(requested))show(requested);
 window.addEventListener('hashchange',()=>{const value=location.hash.slice(1);if(['orla','escudo','mercado','regras','ficha'].includes(value))show(value)});
})();
</script>
</body></html>
