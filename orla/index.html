<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orla v0.62 · Mesa Estelar</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#192139;color:#eee4f9;font:16px system-ui}main{padding:30px;max-width:520px;border:1px solid #8975a6;border-radius:16px;background:#2b2746;text-align:center}a{color:#b9def3}</style></head><body><main><h1>✦ Orla v0.62</h1><p id="status">Preparando a campanha…</p><p><a href="./online/">Entrar na sessão online 3D</a></p></main><script>
(async()=>{try{const r=await fetch('release-v062.json',{cache:'no-cache'});if(!r.ok)throw Error('Manifesto indisponível');const m=await r.json();if(m.version!=='0.62'||m.data!=='game-v062.txt'||!/^[a-f0-9]{64}$/.test(m.sha256))throw Error('Atualização incompleta');const f=await fetch(m.data);if(!f.ok)throw Error('Jogo indisponível');const binary=atob(await f.text()),bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(html))),n=>n.toString(16).padStart(2,'0')).join('');if(hash!==m.sha256)throw Error('Falha na integridade da Orla');document.open('text/html','replace');document.write(html);document.close();}catch(e){console.error(e);document.getElementById('status').textContent='Erro ao carregar: '+e.message;}})();
</script></body></html>
